name: Build Cargo voice inputs
description: Build and upload same-commit native voice SDK and runtime inputs.
inputs:
  target:
    description: Native target triple matching the runner
    required: true
  buildbuddy-api-key:
    description: Optional BuildBuddy credential for trusted CI builds
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
        architecture: ${{ contains(inputs.target, 'aarch64') && 'arm64' || 'x64' }}
    - uses: ./.github/actions/prepare-bazel-ci
      with:
        target: ${{ inputs.target }}
        cache-scope: cargo-voice-native
    - name: Build and stage native dependencies
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ inputs.buildbuddy-api-key }}
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        arch="${TARGET%%-*}"
        case "$RUNNER_OS" in
          macOS) prefix="macos_$arch"; temp="$RUNNER_TEMP" ;;
          Linux) prefix="linux_$arch"; temp="$RUNNER_TEMP" ;;
          *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        wrapper=(--remote-download-toplevel --print-failed-action-summary)
        flags=(--config=release --build_metadata="COMMIT_SHA=$GITHUB_SHA")
        if [[ "$RUNNER_OS" == macOS ]]; then
          flags+=(--macos_minimum_os=14.0)
        fi
        ./.github/scripts/run-bazel-ci.sh "${wrapper[@]}" -- build "${flags[@]}" -- \
          //third_party/voice:native_sdk //third_party/voice:native_runtime
        runtime="bazel-bin/third_party/voice/native_runtime_${prefix}"
        output="$temp/cargo-voice-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        python third_party/voice/cargo_ci.py stage --sdk "${runtime}_sdk" --runtime "$runtime" --output "$output" --target "$TARGET"
        tar -czf "$temp/cargo-voice.tar.gz" -C "$output" sdk runtime
    - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: cargo-voice-${{ inputs.target }}
        path: ${{ runner.temp }}/cargo-voice.tar.gz
        if-no-files-found: error
        overwrite: true
